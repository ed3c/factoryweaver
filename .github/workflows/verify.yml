name: verify-public-contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.20,<5'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/factory_profile.py validate examples/factory-profiles/pstack-synthetic.json
      - run: python scripts/factory_profile.py audit-catalog examples/factory-profiles/pstack-synthetic.json examples/factory-profiles/pstack-binding-synthetic.json examples/factory-profiles/pstack-catalog-synthetic.json
      - run: python scripts/factory_profile.py validate examples/factory-profiles/builder-synthetic.json
      - run: python scripts/factoryweaver.py validate examples/matt-grilling/project.json
      - run: python scripts/factoryweaver.py project examples/openai-plugin-platform/project.json
