name: verify-public-contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.20,<5'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_skill_bundle.py .dist/factoryweaver
      - uses: actions/upload-artifact@v4
        with:
          name: factoryweaver-portable-reference
          path: .dist/factoryweaver/
          retention-days: 7
      - run: python scripts/factoryweaver.py validate examples/matt-grilling/project.json
      - run: python scripts/factoryweaver.py project examples/openai-plugin-platform/project.json
