name: verify-public-contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Run public contract controls
        run: python -m unittest discover -s tests -v
      - name: Validate human decision fixture
        run: python scripts/factoryweaver.py validate examples/matt-grilling/project.json
      - name: Project source fixture
        run: python scripts/factoryweaver.py project examples/openai-plugin-platform/project.json
      - name: Validate closed-loop requirements
        run: python scripts/factoryweaver.py validate docs/closed-loop-v72/project.json
      - name: Build and verify portable v7.2 distribution
        run: |
          python scripts/build_skill_bundle.py .dist/factoryweaver
          python scripts/check_bundle.py .dist/factoryweaver
          python scripts/verify_installed_skill.py .dist/factoryweaver
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Install complete bundle in a foreign Codex-target directory
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p .dist/foreign-consumer
          (cd .dist/foreign-consumer && npx --yes skills@1.7.1 add ../factoryweaver --skill factoryweaver -a codex -y --copy)
          python scripts/verify_installed_skill.py .dist/foreign-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: factoryweaver-portable-reference
          path: .dist/factoryweaver/
          include-hidden-files: true
          if-no-files-found: error
      - name: Maintain the project-local CLI verification map
        run: python .cursor/skills/verify-factoryweaver/scripts/verify.py maintain --scope local --evidence-dir .verification-evidence
      - name: Retain real CLI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoryweaver-local-cli-evidence
          path: .verification-evidence/
          if-no-files-found: error
          include-hidden-files: true
